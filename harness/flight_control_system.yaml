# Flight control system harness (work in progress)
# Scope so far: PDB -> Cube Orange+ power link, and two DroneCAN links:
# Cube CAN1 -> Sierra PrecisionPoint-Pro GPS (CAN1.1), with the airspeed sensor daisy-chained
# behind it (GPS CAN1.2 -> airspeed sensor), and Cube CAN2 -> port 1 of the passive CAN splitter
# (the servo branches, ports 2 to 5, are in actuators_system.yaml).
# The LightWare GRF-500 LiDAR is wired to the Cube GPS2 port (UART8, SERIAL4 in ArduPilot).
# ServoBoard and the other signals come later.
#
# Cable lengths are 0 for now (placeholder). Real lengths come after the layout analysis.

metadata:
  title: Flight control system
  description: Flight controller power link, DroneCAN links (GPS and daisy-chained airspeed sensor on CAN1, CAN splitter port 1 on CAN2) and LiDAR on GPS2

connectors:

  # Harness-side plug that mates with the PDB's 6-pin JST-GH output (board part SM06B-GHS-TB).
  # The PDB board is defined in power_system.yaml; only its output plug appears here.
  PDB_FC_PWR:
    type: JST GH 6-pin plug housing
    subtype: female
    manufacturer: JST
    mpn: GHR-06V-S
    notes: "PDB analog power output. Pin order assumed 5V, 5V, IOUT, VOUT, GND, GND."
    pinlabels: [5V, 5V, IOUT, VOUT, GND, GND]

  # Harness-side plug for the Cube Orange+ POWER1 port.
  FC_POWER1:
    type: Molex CLIK-Mate 2.00 mm 6-pin housing
    notes: "Cube Orange+ POWER1. CURRENT and VOLTAGE are analog, 3.3 V max."
    pinlabels: [VCC, VCC, CURRENT, VOLTAGE, GND, GND]

  # ---- DroneCAN: Cube CAN1 -> GPS -> airspeed sensor (daisy chain), Cube CAN2 -> CAN splitter ---
  # All CAN ports below use the Pixhawk standard 4-pin order: 1 VCC (5 V), 2 CAN_H, 3 CAN_L, 4 GND.
  # The Cube and the Sierra GPS document this order. For the airspeed sensor it is an ASSUMPTION,
  # because Sierra has no pinout document. TODO: get it from Sierra before the first power-up.
  # Cube ports: the CubePilot interface specification (docs.cubepilot.org, The Cube, interface
  # specifications) says the high-density ports use JST-GH 1.25 mm cabling and gives the CAN ports
  # 4 pins. It does not name a connector part per port, so JST GH 4-pin for CAN1/CAN2 is the
  # standard, not a per-port statement. Pin 1 is VCC_5V (red) in the Cube pin tables; the page does
  # not say which physical end of the header is pin 1.
  # TODO: confirm the CAN1/CAN2 headers on the real carrier (SM04B-GHS-TB expected) and the series
  # of the GPS and airspeed sensor ports before buying plugs.

  # Cube Orange+ CAN1: GPS, with the airspeed sensor daisy-chained behind it. The bus is point to
  # point at the Cube end and the airspeed sensor is the far end, so both ends need 120 ohm
  # termination. Cube end: each Cube CAN port is terminated with 120 ohm (docs/CAN Termination for
  # Servos.md); confirm by measuring CAN_H to CAN_L with nothing plugged in and power off.
  FC_CAN1:
    type: JST GH 4-pin
    subtype: female
    manufacturer: JST
    mpn: GHR-04V-S   # TODO: confirm series on the carrier
    notes: "Cube Orange+ CAN1 (GPS, then airspeed sensor). The Cube supplies the 5 V on pin 1. Cube end is terminated (120 ohm)."
    pinlabels: [VCC, CAN_H, CAN_L, GND]

  # Cube Orange+ CAN2: passive CAN splitter port 1, which feeds the four servos (ports 2 to 5 are in
  # actuators_system.yaml). Only CAN_H, CAN_L and GND are wired; the 5 V pin stays empty, because
  # the splitter bus 5 V pin is not used by the servo branches.
  FC_CAN2:
    type: JST GH 4-pin
    subtype: female
    manufacturer: JST
    mpn: GHR-04V-S   # TODO: confirm series on the carrier
    notes: "Cube Orange+ CAN2 (CAN splitter port 1). Cube end is terminated (120 ohm). Pin 1 (5 V) not wired."
    pinlabels: [VCC, CAN_H, CAN_L, GND]
    hide_disconnected_pins: true

  # CAN splitter port 1 (SwiftWing 6-port passive splitter, JST-GH 4-pin ports, all ports bussed).
  # The other ports are in actuators_system.yaml (CAN_SPL_P2 to P5). The splitter has no
  # termination and no isolation. Same pin order on every port: 1 +5 V, 2 CAN_H, 3 CAN_L, 4 GND.
  # TODO: GH housing part number and contact type (GHR-04V-S with SSHL-002T-P0.2 for 26 AWG), and
  # confirm that the splitter ports are SM04B-GHS-TB headers.
  CAN_SPL_P1:
    type: JST GH 4-pin
    subtype: female
    manufacturer: JST
    mpn: GHR-04V-S
    notes: "CAN splitter port 1 (passive, bussed): Cube CAN2. Pin 1 (5 V) not wired."
    pinlabels: [VCC_5V, CAN_H, CAN_L, GND]
    hide_disconnected_pins: true

  # Sierra PrecisionPoint-Pro CAN1.1: first node on the CAN1 bus, with the airspeed sensor behind it
  # on CAN1.2. It is NOT an end node any more, so its termination must stay OFF (CAN_TERM=0, which
  # is also the Sierra default).
  # TODO: confirm in the Sierra manual that CAN1.1 and CAN1.2 are bussed inside the module (CAN
  # lines and 5 V), and that 5 V 250 mA is the module's own draw (the sensor adds about 50 mA).
  GPS_CAN1_1:
    type: 4-pin CAN plug   # TODO: series
    notes: "Sierra PrecisionPoint-Pro CAN1.1 (from the Cube). Max 5 V 250 mA for the module. Not the end node: termination off (CAN_TERM=0, the Sierra default)."
    pinlabels: [VCC, CAN_H, CAN_L, GND]

  # Sierra PrecisionPoint-Pro CAN1.2: the daisy chain output towards the airspeed sensor. Pin order
  # assumed the same as CAN1.1 (Pixhawk standard).
  GPS_CAN1_2:
    type: 4-pin CAN plug   # TODO: series
    notes: "Sierra PrecisionPoint-Pro CAN1.2 (to the airspeed sensor). Pin order assumed same as CAN1.1."
    pinlabels: [VCC, CAN_H, CAN_L, GND]

  # Sierra TrueSpeed V2 airspeed sensor, last node on the CAN1 bus behind the GPS. Pin order
  # assumed (see above).
  # Termination: Sierra's default is OFF, and whether to terminate this far end is UNSETTLED.
  # TODO: decide (enable the sensor termination if it has one, or a 120 ohm resistor across CAN_H
  # and CAN_L at this end, or none), since it is the far end of the bus.
  ARSP_CAN:
    type: 4-pin CAN plug   # TODO: series
    notes: "Sierra TrueSpeed V2 CAN port, about 50 mA nominal. Pin order assumed Pixhawk standard. Far end of the CAN1 bus: termination off by default, decision open."
    pinlabels: [VCC, CAN_H, CAN_L, GND]

  # ---- LightWare GRF-500 LiDAR -> Cube GPS2 (UART, 3.3 V logic) ------------------------------
  # GRF-500 serial/I2C port: JST SUR 8-pin, mating housing 08SUR-32S (product guide, section 7.2).
  # Pin 1 TXD (sensor transmit), 2 RXD (sensor receive), 3 GPIO (alarm output, unused),
  # 4 not used, 5 Disable (leave floating to operate), 6 VIN 4.5-5.5 V (120 mA typical,
  # 250 mA surge at start-up), 7 GND, 8 GND. Pin labels repeat (GND), so pins are used by number.
  LRF_COMM:
    type: JST SUR 8-pin plug housing
    subtype: female
    manufacturer: JST
    mpn: 08SUR-32S
    notes: "LightWare GRF-500 serial port. Pin 1 is the sensor TXD, so it goes to the Cube RX. Pin 5 (Disable) stays floating. TODO: crimp contact part number and wire range for the SUR series."
    pinlabels: [TXD, RXD, GPIO, NC, DISABLE, VIN, GND, GND]
    hide_disconnected_pins: true

  # Cube Orange+ GPS2 port, 6-pin: 1 VCC 5 V, 2 TX (out), 3 RX (in), 4 SCL (I2C1), 5 SDA (I2C1),
  # 6 GND. UART signals are 3.3 V, which matches the GRF-500 (3.3 V TTL, 5 V tolerant).
  # SCL/SDA are not used (the GRF-500 is on UART here), so pins 4 and 5 stay empty.
  FC_GPS2:
    type: 6-pin GPS2 plug   # TODO: series
    notes: "Cube Orange+ GPS2 (UART8). Cube TX (pin 2) goes to the sensor RXD, Cube RX (pin 3) to the sensor TXD."
    pinlabels: [VCC, TX, RX, SCL, SDA, GND]
    hide_disconnected_pins: true

  # Not used: Sierra PrecisionPoint-Pro 7-pin Peripherals port (F9P UART2
  # TX/RX, MCU USART1 TX/RX, PPS, EXTINT, GND, all 3.3 V). Not needed for DroneCAN, left unwired.

cables:

  # PDB -> Cube POWER1, one wire per pin, straight through.
  # 26 AWG is the one size both crimp contacts accept (JST GH contact: 26-30 AWG, 1 A;
  # Molex CLIK-Mate 2.00 mm terminal: 22-26 AWG). Load is well under 1 A on the two 5 V pins.
  # Colors: two red 5 V, yellow for the current sense, blue for the voltage sense, two black
  # ground. ArduPilot docs show the vendor convention as red/black only, so this is a
  # choice to tell the two analog signals apart. Change if you prefer the vendor look.
  W_FC_01:
    wirecount: 6
    gauge: 26 AWG
    colors: [RD, RD, YE, BU, BK, BK]
    length: 0   # TODO: real length after layout analysis
    notes: "PDB analog power output to Cube POWER1"

  # Cube CAN1 -> GPS CAN1.1. 5 V, CAN_H, CAN_L, GND. Keep CAN_H and CAN_L twisted together.
  # Colors vary between vendors; yellow = CAN_H and green = CAN_L is a choice, not a standard.
  # Load on this cable is the GPS only (up to 250 mA), well inside 26 AWG and a 1 A JST-GH contact.
  W_FC_02:
    wirecount: 4
    gauge: 26 AWG
    colors: [RD, YE, GN, BK]
    length: 0   # TODO: real length after layout analysis
    notes: "Cube CAN1 to GPS. Twist CAN_H/CAN_L."

  # GPS CAN1.2 -> airspeed sensor (daisy chain). Expected to be long (sensor position not fixed
  # yet). Load is about 50 mA, so the 5 V drop on 26 AWG is small even for a few metres. For a long
  # run keep CAN_H/CAN_L twisted and consider a shielded cable.
  W_FC_03:
    wirecount: 4
    gauge: 26 AWG
    colors: [RD, YE, GN, BK]
    length: 0   # TODO: real length after layout analysis, expected long
    notes: "GPS CAN1.2 to airspeed sensor (daisy chain). Twist CAN_H/CAN_L; long run."

  # Cube GPS2 -> GRF-500. 4 wires: 5 V, sensor TXD to Cube RX, Cube TX to sensor RXD, GND.
  # Only GND pin 7 is used (pin 8 is also GND on the sensor). Load is 120 mA typical, 250 mA at
  # start-up: on 30 AWG that is about 0.17 V per metre of cable (supply plus return), against
  # a 4.5 V minimum at the sensor, so keep the run short or use a heavier wire.
  # TODO: SUR contact wire range is not confirmed (GH takes 26-30 AWG), so check 30 AWG fits both.
  W_FC_04:
    wirecount: 4
    gauge: 30 AWG
    colors: [RD, YE, GN, BK]
    length: 0   # TODO: real length after layout analysis
    notes: "Cube GPS2 to GRF-500 (serial). Wires: 1 5 V, 2 sensor TXD to Cube RX, 3 Cube TX to sensor RXD, 4 GND."

  # Cube CAN2 -> CAN splitter port 1: CAN_H, CAN_L and GND (no 5 V). Keep CAN_H and CAN_L twisted.
  # The splitter servo branches are far over the 0.3 m stub rule (see actuators_system.yaml).
  W_FC_05:
    wirecount: 3
    gauge: 26 AWG
    colors: [YE, GN, BK]
    length: 0   # TODO: real length after layout analysis
    notes: "Cube CAN2 to CAN splitter port 1. Twist CAN_H/CAN_L."

connections:

  # Labels repeat (5V, 5V, GND, GND), so pins are referenced by number.
  - - PDB_FC_PWR: [1-6]
    - W_FC_01: [1-6]
    - FC_POWER1: [1-6]

  # DroneCAN. Labels are unique here, so pins are referenced by name.
  - - FC_CAN1: [VCC, CAN_H, CAN_L, GND]
    - W_FC_02: [1, 2, 3, 4]
    - GPS_CAN1_1: [VCC, CAN_H, CAN_L, GND]

  # Airspeed sensor daisy-chained behind the GPS.
  - - GPS_CAN1_2: [VCC, CAN_H, CAN_L, GND]
    - W_FC_03: [1, 2, 3, 4]
    - ARSP_CAN: [VCC, CAN_H, CAN_L, GND]

  # Cube CAN2 -> CAN splitter port 1 (CAN_H, CAN_L, GND; pin 1 5 V not wired).
  - - FC_CAN2: [CAN_H, CAN_L, GND]
    - W_FC_05: [1, 2, 3]
    - CAN_SPL_P1: [CAN_H, CAN_L, GND]

  # LiDAR on GPS2, referenced by pin number (LRF_COMM has two GND pins).
  # Cube VCC(1) -> sensor VIN(6); Cube RX(3) <- sensor TXD(1); Cube TX(2) -> sensor RXD(2); GND(6) -> GND(7).
  - - FC_GPS2: [1, 3, 2, 6]
    - W_FC_04: [1, 2, 3, 4]
    - LRF_COMM: [6, 1, 2, 7]
