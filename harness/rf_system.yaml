# RF system harness (work in progress)
# Scope: Doodle Labs Mesh Rider Mini (RM-1400-42M3, tag AIR): UART link from the Cube telemetry
# port, the 5 V power port, the Ethernet port and the two antenna ports. The UART link and the
# Ethernet link (RJ45 into the Jetson second Ethernet port) are wired; power and antennas are not.
# USB device, USB host and GPIO ports are not used.
#
# Port layout (datasheet, Doodle Labs mini-OEM connector descriptions): ports 1, 2, 3, 5 and 6 are
# JST SM4B-GHS-TB (4 pin), port 4 is JST SM6B-GHS-TB (6 pin), antennas ANT 0 / ANT 1 are Molex
# 73414-0100 MMCX female. The datasheet table lists port 2, 3, 5 and 6 as 6 pin; the module has 4.
# Harness side: JST GHR-xxV-S housings with SSHL-002T-P0.2 crimp contacts (26 to 30 AWG, 1 A each).
#
# TODO: pin 1 position (and the pin numbering direction) on the module headers is not checked yet.
# The pin tables are from Doodle's mini-OEM page; the RM-1400-42M3 datasheet lists the same ports
# and part numbers, but confirm on the module.
#
# Cable lengths are 0 for now (placeholder). Real lengths come after the layout analysis.
# Gauges and colors are recommendations, see the comment above each cable.

metadata:
  title: RF system
  description: Mesh Rider Mini UART link from the Cube, power, Ethernet and antenna ports

connectors:

  # Cube Orange+ telemetry port, 6-pin: 1 VCC 5 V, 2 TX (out), 3 RX (in), 4 CTS, 5 RTS, 6 GND, all
  # signals 3.3 V (same pin order as the GPS2 port in flight_control_system.yaml, standard Cube
  # pinout). Only TX, RX and GND are used; the 5 V pin stays empty (the radio has its own supply)
  # and the radio has no flow-control pins, so CTS and RTS stay empty too.
  # TODO: plug series (the Cube end is a JST GH).
  FC_TELEM1:
    type: 6-pin TELEM plug   # TODO: series
    notes: "Cube Orange+ TELEM1 port (UART). Cube TX (pin 2) goes to the radio UART_RX, Cube RX (pin 3) to the radio UART_TX. 3.3 V logic."
    pinlabels: [VCC, TX, RX, CTS, RTS, GND]
    hide_disconnected_pins: true

  # Radio port 3, UART + reset: pin 1 GND, 2 RESET (2.8 V, default high, pull low to reset),
  # 3 UART_RX (input to the radio, 3.3 V), 4 UART_TX (output from the radio, 3.3 V).
  # RESET stays empty. The mating housing is a 4-pin GHR-04V-S.
  RF_P3:
    type: JST GH 4-pin plug housing
    subtype: female
    manufacturer: JST
    mpn: GHR-04V-S
    notes: "Mesh Rider Mini port 3 (UART + reset), mates with SM4B-GHS-TB. Crimp contacts SSHL-002T-P0.2. RESET stays empty."
    pinlabels: [GND, RESET, UART_RX, UART_TX]
    hide_disconnected_pins: true

  # Radio port 4, 5 V power: pins 1, 2, 3 are 5 V input and 4, 5, 6 are GND. All six pins must be
  # used: one GH contact is only rated 1 A, and the radio draws about 5 W average and 8 W peak
  # (about 1.6 A at 5 V). Supply is 5 V +/- 5 %.
  # Not wired yet: the BEC is not decided. The mating housing is a 6-pin GHR-06V-S.
  # TODO: when the BEC is chosen, tie the three 5 V wires together and the three GND wires
  # together at the housing, and add a bulk capacitor close to the connector.
  RF_P4:
    type: JST GH 6-pin plug housing
    subtype: female
    manufacturer: JST
    mpn: GHR-06V-S
    notes: "Mesh Rider Mini port 4 (5 V power), mates with SM6B-GHS-TB. Crimp contacts SSHL-002T-P0.2. Use all six pins."
    pinlabels: [5V_1, 5V_2, 5V_3, GND_4, GND_5, GND_6]

  # Radio port 2, Ethernet (100 Base-T): pin 1 ETH1_RX_N, 2 ETH1_RX_P, 3 ETH1_TX_N, 4 ETH1_TX_P
  # (directions are from the radio's side). Wired to an RJ45 plug (RF_RJ45 below), which plugs into
  # the second Ethernet port of the Jetson (JET_ETH2).
  # The mating housing is a 4-pin GHR-04V-S.
  RF_P2:
    type: JST GH 4-pin plug housing
    subtype: female
    manufacturer: JST
    mpn: GHR-04V-S
    notes: "Mesh Rider Mini port 2 (Ethernet, 100 Base-T), mates with SM4B-GHS-TB. Crimp contacts SSHL-002T-P0.2. To the Jetson second Ethernet port via RJ45."
    pinlabels: [ETH_RX_N, ETH_RX_P, ETH_TX_N, ETH_TX_P]
    hide_disconnected_pins: true

  # ---- Radio Ethernet: RJ45 plug on our cable, and the Jetson second Ethernet port -----------
  # The radio's GH Ethernet pins are converted to an RJ45 by our own cable (W_RF_02). That RJ45
  # plug (RF_RJ45) plugs into the second Ethernet port on the Jetson board (JET_ETH2). The radio
  # connects straight to the Jetson, no switch. Same convention as the A8-MINI link in
  # cellular_system.yaml: the RJ45 pin numbers and names are the standard ones as seen by the Jetson
  # (pins 1/2 = Jetson TX+/TX-, pins 3/6 = Jetson RX+/RX-), while the radio pin names are from the
  # radio's side, so the pairs cross over: radio ETH_RX_P (pin 2) lands on RJ45 pin 1 (Jetson TX+),
  # ETH_RX_N (pin 1) on pin 2, ETH_TX_P (pin 4) on pin 3 (Jetson RX+) and ETH_TX_N (pin 3) on pin 6.
  # Pins 4, 5, 7, 8 are only used for gigabit; the radio port is 100 Base-T, so they stay empty.
  # TODO: RJ45 plug part number (and shielded or not).
  RF_RJ45:
    type: RJ45 plug (8P8C)
    subtype: male
    notes: "Plug on the radio Ethernet cable, into the Jetson second Ethernet port. Pins 4, 5, 7, 8 unused (radio port is 100 Base-T)."
    pinlabels: [TX+, TX-, RX+, NC, NC, RX-, NC, NC]
    hide_disconnected_pins: true

  # TODO: which Jetson module and carrier board, which physical port is the second Ethernet port,
  # and how it is set up (static address on the radio subnet, no DHCP clash with the camera port).
  JET_ETH2:
    type: RJ45 jack (8P8C)
    subtype: female
    notes: "Jetson board second Ethernet port. Direct link to the Mesh Rider radio. Pins 4, 5, 7, 8 not used (radio port is 100 Base-T)."
    pinlabels: [TX+, TX-, RX+, NC, NC, RX-, NC, NC]
    hide_disconnected_pins: true

  # Antenna ports, MMCX female on the radio (Molex 73414-0100), so the antenna cable has an MMCX
  # male plug here. 2x2 MIMO, so both ports are expected to be used. Not wired for now.
  # TODO: antenna choice (must cover the band in use: 455 MHz and 2.2 to 2.5 GHz need different
  # antennas), cable, and the MMCX plug part number.
  RF_ANT0:
    type: MMCX male plug   # TODO: part number
    subtype: male
    notes: "Mesh Rider Mini ANT 0, mates with the radio MMCX female. Center = RF signal, shield = ground."
    pinlabels: [RF, GND]

  RF_ANT1:
    type: MMCX male plug   # TODO: part number
    subtype: male
    notes: "Mesh Rider Mini ANT 1, mates with the radio MMCX female. Center = RF signal, shield = ground."
    pinlabels: [RF, GND]

cables:

  # Cube TELEM -> radio port 3. 3.3 V UART, so any thin wire does. 28 AWG sits inside the GH
  # contact range (26 to 30 AWG). Colors: yellow = Cube TX to radio RX, green = Cube RX from
  # radio TX, black = ground.
  # TODO: shielded or twisted pair if the run turns out long or noisy (the radio is a 2.4 GHz
  # transmitter), and the real baud rate on the Cube side.
  W_RF_01:
    wirecount: 3
    gauge: 28 AWG
    colors: [YE, GN, BK]
    length: 0   # TODO: real length after layout analysis
    notes: "Cube TELEM1 to radio UART"

  # Radio port 2 (Ethernet) -> RJ45 plug. Two twisted pairs, wire colours follow T568B so the pairs
  # match the RJ45 pin pairs, same as W_CEL_01:
  #   white-orange + orange = RJ45 pins 1, 2  (Jetson TX pair, goes to the radio RX pins)
  #   white-green + green   = RJ45 pins 3, 6  (Jetson RX pair, comes from the radio TX pins)
  # Wire order follows the radio pins 1 to 4 (RX_N, RX_P, TX_N, TX_P): orange, white-orange, green,
  # white-green. 26 AWG is a placeholder (a GH contact takes 26 to 30 AWG). 100 Base-T over a short
  # run needs no shield; revisit next to the 2.4 GHz transmitter.
  # TODO: gauge, shielding and length after layout.
  W_RF_02:
    wirecount: 4
    gauge: 26 AWG
    colors: [OG, WHOG, GN, WHGN]
    length: 0   # TODO: real length after layout analysis
    notes: "Radio Ethernet port 2 to RJ45 plug. Two twisted pairs, crossover wiring (see comments)."

connections:

  # Cube TELEM -> radio port 3 (UART). Cube TX goes to the radio RX and Cube RX to the radio TX.
  - - FC_TELEM1: [TX, RX, GND]
    - W_RF_01: [1, 2, 3]
    - RF_P3: [UART_RX, UART_TX, GND]

  # Step 1: radio Ethernet pins to the RJ45 plug, through our cable (crossover, see W_RF_02).
  - - RF_P2: [ETH_RX_N, ETH_RX_P, ETH_TX_N, ETH_TX_P]
    - W_RF_02: [1, 2, 3, 4]
    - RF_RJ45: [2, 1, 6, 3]    # TX-, TX+, RX-, RX+ (Jetson side names)

  # Step 2: the RJ45 plug mates with the Jetson second Ethernet port, pin for pin (straight through).
  -
    - RF_RJ45: [1, 2, 3, 6]
    - -->
    - JET_ETH2: [1, 2, 3, 6]

  # Not wired yet: RF_P4 (5 V, BEC not decided) and RF_ANT0 / RF_ANT1.
