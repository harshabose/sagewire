  # ---- Wing split, no sharing ----------------------------------------------------------
  # Wing side: DB-25 plug -> servo M5 plug, LED and ESC signal pads (one cable per link).
  # LED wires: 22 AWG (LED 0.8 A peak; the run may be a few metres).
  # Servo power, signal and CAN wires: 26 AWG. The servo power wires are 26 AWG so they fit the M5
  # plug solder cups (the servo lead itself is 26 AWG, and GH contacts take 26 AWG at most). The
  # cost is voltage drop, see the comment above each servo power cable.
  # Colors: servo CAN_H yellow, CAN_L green; ESC T yellow, S white, signal GND black; LED 5 V red,
  # signal white, GND black.
