  # XT90 male at the wing split -> ESC input, VTOL motors 1 to 4.
  # Motor numbers follow the ArduPilot QuadPlane Quad X default: 1 front right (CCW), 2 rear left (CCW),
  # 3 front left (CW), 4 rear right (CW); left wing = motors 3 and 2, right wing = motors 1 and 4.
  # TODO: check the spin direction on the real build (swap two phase wires to reverse a motor).
  - - XT90_VTOL1_M: [POS, NEG]
    - W_ACT_01: [1, 2]
    - ESC_VTOL1_IN: [IN_POS, IN_NEG]
  - - XT90_VTOL2_M: [POS, NEG]
    - W_ACT_02: [1, 2]
    - ESC_VTOL2_IN: [IN_POS, IN_NEG]
  - - XT90_VTOL3_M: [POS, NEG]
    - W_ACT_03: [1, 2]
    - ESC_VTOL3_IN: [IN_POS, IN_NEG]
  - - XT90_VTOL4_M: [POS, NEG]
    - W_ACT_04: [1, 2]
    - ESC_VTOL4_IN: [IN_POS, IN_NEG]

  # ESC motor phase pads -> motor, VTOL motors 1 to 4.
