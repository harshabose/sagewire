    - W_ACT_21: [1, 2]
    - SRV_R2: [V_POS, GND]
  -
    - SPLIT_R_WING: [SRV2_CANH, SRV2_CANL]
    - W_ACT_22: [1, 2]
    - SRV_R2: [CAN_H, CAN_L]
  -
    - SPLIT_R_WING: [LED1_5V, LED1_SIG, LED1_GND]
    - W_ACT_23: [1, 2, 3]
    - LED_R1: [5V, SIGNAL, GND]
  -
    - SPLIT_R_WING: [LED2_5V, LED2_SIG, LED2_GND]
    - W_ACT_24: [1, 2, 3]
    - LED_R2: [5V, SIGNAL, GND]
  -
    - SPLIT_R_WING: [LEDT_5V, LEDT_SIG, LEDT_GND]
    - W_ACT_25: [1, 2, 3]
    - LED_RT: [5V, SIGNAL, GND]
  -
    - SPLIT_R_WING: [ESC1_T, ESC1_S, ESC1_SGND]
    - W_ACT_26: [1, 2, 3]
    - ESC_VTOL1_SIG: [T, S, SIG_GND]
  -
    - SPLIT_R_WING: [ESC2_T, ESC2_S, ESC2_SGND]
    - W_ACT_27: [1, 2, 3]
    - ESC_VTOL4_SIG: [T, S, SIG_GND]
  -
