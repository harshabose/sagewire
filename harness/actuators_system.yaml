# Actuators system harness (work in progress)
# Scope: wing split -> ESC power input -> motor phase leads for the four VTOL motors (numbered as in
# the ArduPilot Quad X default: 1 front right, 2 rear left, 3 front left, 4 rear right)
# (XT90 male on the wing side, APD 120F3 ESC, Vector Technics 8020 PRO 120KV motor), plus the
# forward-thrust ESC and motor.
# The fuselage side (PDB ESC pads -> XT90 female) lives in power_system.yaml. The ESC signal (T, S)
# wiring is in the wing split section; the capacitor wiring is not added yet.
# The forward-thrust ESC (same APD 120F3) is wired to the PDB in power_system.yaml (ESC_FWD_IN);
# its signal, capacitor and motor phase pads are here (ESC_FWD_SIG, ESC_FWD_CAP, ESC_FWD_PH), and
# the motor is a Vector Technics VT4130 300KV with an 18 inch propeller.
# The wing split signal connectors (DB-25, one pair per wing), the wing servos, the wing LEDs and the
# CAN splitter ports are at the end of the connectors section. They are wired with NO SHARING: every
# servo, LED and ESC signal link has its own power, ground and signal pins through the DB-25, and
# every servo has its own CAN pair to its own port on the passive CAN splitter. The DB-25 pin order
# below is provisional (not fixed yet). The fuselage side sources (12 V, 5 V, Cube outputs) are not
# modelled yet, so those fuselage pins only show the mate to the wing side.
#
# Cable lengths are 0 for now (placeholder). Real lengths come after the layout analysis.
# Gauges and colors are recommendations, see the comment above each cable.

metadata:
  title: Actuators system
  description: VTOL motor power, wing split (DB-25, no sharing), servos, LEDs, ESC signals, CAN splitter ports

connectors:

  # Wing split, wing side: one XT90 male per VTOL motor ESC. It mates with the XT90 female
  # in power_system.yaml (XT90_VTOL{n}_F). Synthetic pin IDs; the housing is keyed, so polarity
  # cannot be reversed.
  # TODO: variant (plain XT90, XT90-S anti-spark or XT90H) and part number. It must match the
  # female side. XT90 is rated for 90 A continuous: check against the real ESC peak current.
  XT90_VTOL1_M:
    type: XT90 male
    subtype: male
    manufacturer: Amass
    notes: "VTOL motor 1 (front right) power, wing split (wing side)"
    pinlabels: [POS, NEG]

  XT90_VTOL2_M:
    type: XT90 male
    subtype: male
    manufacturer: Amass
    notes: "VTOL motor 2 (rear left) power, wing split (wing side)"
    pinlabels: [POS, NEG]

  XT90_VTOL3_M:
    type: XT90 male
    subtype: male
    manufacturer: Amass
    notes: "VTOL motor 3 (front left) power, wing split (wing side)"
    pinlabels: [POS, NEG]

  XT90_VTOL4_M:
    type: XT90 male
    subtype: male
    manufacturer: Amass
    notes: "VTOL motor 4 (rear right) power, wing split (wing side)"
    pinlabels: [POS, NEG]

  # ESC: APD 120F3 (120 A rating), one per VTOL motor. All its connections are solder pads, so
  # there is nothing to buy on the ESC side; the harness wires are soldered straight to the pads.
  # The board has three groups of pads, modelled as three connectors per ESC. Pin IDs are
  # synthetic (pads have no numbers), in label order.
  # TODO: the pad picture was of the F3[X] board; confirm the 120F3 pad layout is the same.
  # TODO: the 120F3[X] is sold as a 12S, 50 V ESC, but a fully charged 12S pack is 50.4 V (more
  # for LiHV), and braking spikes add to that. Check the APD datasheet for the real maximum.
  # TODO: APD asks for a capacitor on the ESC pads (330 uF to 1000 uF, low ESR) and more
  # whenever the input wiring is longer than 12 cm. It will be longer here (wing split). Use a
  # voltage rating well above 50.4 V (not 50 V), e.g. 63 V or more.
  #
  # Battery input pads (+ and -, the two large pads).
  ESC_VTOL1_IN:
    type: Solder pads
    notes: "VTOL motor 1 (front right) ESC battery input, + and -"
    pinlabels: [IN_POS, IN_NEG]
    ignore_in_bom: true

  ESC_VTOL2_IN:
    type: Solder pads
    notes: "VTOL motor 2 (rear left) ESC battery input, + and -"
    pinlabels: [IN_POS, IN_NEG]
    ignore_in_bom: true

  ESC_VTOL3_IN:
    type: Solder pads
    notes: "VTOL motor 3 (front left) ESC battery input, + and -"
    pinlabels: [IN_POS, IN_NEG]
    ignore_in_bom: true

  ESC_VTOL4_IN:
    type: Solder pads
    notes: "VTOL motor 4 (rear right) ESC battery input, + and -"
    pinlabels: [IN_POS, IN_NEG]
    ignore_in_bom: true

  # Motor phase pads on the ESC (three pads). Sensorless motor, so the three phases can go to any
  # pad: swapping any two phase wires reverses the spin direction (APD also has a motor reverse
  # solder tab). Pad labels are synthetic.
  # TODO: check the real pad labels on the 120F3 board and set the spin direction per motor.
  ESC_VTOL1_PH:
    type: Solder pads
    notes: "VTOL motor 1 (front right) ESC motor phase pads"
    pinlabels: [PH_A, PH_B, PH_C]
    ignore_in_bom: true

  ESC_VTOL2_PH:
    type: Solder pads
    notes: "VTOL motor 2 (rear left) ESC motor phase pads"
    pinlabels: [PH_A, PH_B, PH_C]
    ignore_in_bom: true

  ESC_VTOL3_PH:
    type: Solder pads
    notes: "VTOL motor 3 (front left) ESC motor phase pads"
    pinlabels: [PH_A, PH_B, PH_C]
    ignore_in_bom: true

  ESC_VTOL4_PH:
    type: Solder pads
    notes: "VTOL motor 4 (rear right) ESC motor phase pads"
    pinlabels: [PH_A, PH_B, PH_C]
    ignore_in_bom: true

  # Vector Technics 8020 PRO 120KV motor, one per VTOL arm. The three phase leads exit the motor
  # body and are modelled as cable W_ACT_05 to W_ACT_08, so nothing goes in the BOM for them.
  # TODO: lead length, gauge and any connector on the leads are not in the seller listing; check
  # the Vector Technics datasheet or the motor itself.
  MOT_VTOL1:
    type: Motor (three-phase leads exit the body)
    manufacturer: Vector Technics
    notes: "VTOL motor 1 (front right, CCW): 8020 PRO 120KV, 12S, 50 A (180 s) maximum continuous per the seller listing"
    pinlabels: [PH_A, PH_B, PH_C]
    ignore_in_bom: true

  MOT_VTOL2:
    type: Motor (three-phase leads exit the body)
    manufacturer: Vector Technics
    notes: "VTOL motor 2 (rear left, CCW): 8020 PRO 120KV, 12S, 50 A (180 s) maximum continuous per the seller listing"
    pinlabels: [PH_A, PH_B, PH_C]
    ignore_in_bom: true

  MOT_VTOL3:
    type: Motor (three-phase leads exit the body)
    manufacturer: Vector Technics
    notes: "VTOL motor 3 (front left, CW): 8020 PRO 120KV, 12S, 50 A (180 s) maximum continuous per the seller listing"
    pinlabels: [PH_A, PH_B, PH_C]
    ignore_in_bom: true

  MOT_VTOL4:
    type: Motor (three-phase leads exit the body)
    manufacturer: Vector Technics
    notes: "VTOL motor 4 (rear right, CW): 8020 PRO 120KV, 12S, 50 A (180 s) maximum continuous per the seller listing"
    pinlabels: [PH_A, PH_B, PH_C]
    ignore_in_bom: true

  # Signal pads (three small pads, top to bottom: T, S, -).
  # T = ESC telemetry output, S = signal input (PWM), - = signal ground.
  ESC_VTOL1_SIG:
    type: Solder pads
    notes: "VTOL motor 1 (front right) ESC signal pads: T telemetry out, S signal in, GND signal ground"
    pinlabels: [T, S, SIG_GND]
    ignore_in_bom: true

  ESC_VTOL2_SIG:
    type: Solder pads
    notes: "VTOL motor 2 (rear left) ESC signal pads: T telemetry out, S signal in, GND signal ground"
    pinlabels: [T, S, SIG_GND]
    ignore_in_bom: true

  ESC_VTOL3_SIG:
    type: Solder pads
    notes: "VTOL motor 3 (front left) ESC signal pads: T telemetry out, S signal in, GND signal ground"
    pinlabels: [T, S, SIG_GND]
    ignore_in_bom: true

  ESC_VTOL4_SIG:
    type: Solder pads
    notes: "VTOL motor 4 (rear right) ESC signal pads: T telemetry out, S signal in, GND signal ground"
    pinlabels: [T, S, SIG_GND]
    ignore_in_bom: true

  # Capacitor pads (+ and -, marked "Capacitor Mounting Position" on the board, at the top edge).
  # The capacitor itself is added later (count and type not decided yet).
  ESC_VTOL1_CAP:
    type: Solder pads
    notes: "VTOL motor 1 (front right) ESC capacitor pads, + and -. Observe polarity."
    pinlabels: [CAP_POS, CAP_NEG]
    ignore_in_bom: true

  ESC_VTOL2_CAP:
    type: Solder pads
    notes: "VTOL motor 2 (rear left) ESC capacitor pads, + and -. Observe polarity."
    pinlabels: [CAP_POS, CAP_NEG]
    ignore_in_bom: true

  ESC_VTOL3_CAP:
    type: Solder pads
    notes: "VTOL motor 3 (front left) ESC capacitor pads, + and -. Observe polarity."
    pinlabels: [CAP_POS, CAP_NEG]
    ignore_in_bom: true

  ESC_VTOL4_CAP:
    type: Solder pads
    notes: "VTOL motor 4 (rear right) ESC capacitor pads, + and -. Observe polarity."
    pinlabels: [CAP_POS, CAP_NEG]
    ignore_in_bom: true

  # --- Forward-thrust ESC (APD 120F3, same as the VTOL ESCs) ---------------------------
  # Battery input pads are in power_system.yaml (ESC_FWD_IN). Same pad layout as above.
  # Signal pads (top to bottom: T, S, -). T = telemetry out, S = signal in (PWM), - = signal ground.
  ESC_FWD_SIG:
    type: Solder pads
    notes: "Forward ESC signal pads: T telemetry out, S signal in, GND signal ground"
    pinlabels: [T, S, SIG_GND]
    ignore_in_bom: true

  # Capacitor pads (+ and -). The capacitor is added later (count and type not decided yet);
  # same capacitor notes as the VTOL ESCs apply.
  ESC_FWD_CAP:
    type: Solder pads
    notes: "Forward ESC capacitor pads, + and -. Observe polarity."
    pinlabels: [CAP_POS, CAP_NEG]
    ignore_in_bom: true

  # Motor phase pads on the forward ESC. Same notes as the VTOL ESCs: any pad order works, and
  # swapping two phase wires reverses the spin direction. Pad labels are synthetic.
  ESC_FWD_PH:
    type: Solder pads
    notes: "Forward ESC motor phase pads"
    pinlabels: [PH_A, PH_B, PH_C]
    ignore_in_bom: true

  # Forward-thrust motor: Vector Technics VT4130 300KV, 18 inch propeller. The three phase leads
  # exit the motor body and are modelled as cable W_ACT_09.
  # TODO: lead length, gauge and any connector are not known; check the Vector Technics datasheet or
  # the motor. The test data is for a smaller propeller; the 18 inch propeller draws more current
  # (agreed with the vendor), expected to be similar to the VTOL motors.
  MOT_FWD:
    type: Motor (three-phase leads exit the body)
    manufacturer: Vector Technics
    notes: "Forward motor: VT4130 300KV, 18 inch propeller"
    pinlabels: [PH_A, PH_B, PH_C]
    ignore_in_bom: true

  # ==== Wing split (DB-25) and wing consumers ============================================
  # Each wing carries 2 servos (DroneCAN), 3 LEDs (PWM) and 2 ESC signal links (T, S, GND).
  # Wired with NO SHARING (user decision for now): per servo 12 V and GND, per LED 5 V, signal and
  # GND, per ESC T, S and its own signal GND, and a separate CAN pair per servo. That is 23 pins per
  # wing; pins 24 and 25 are spare. The pin current rating is above what the loads need, including
  # the servos (user check).
  #
  # Provisional DB-25 pin map (identical on both wings, so the harnesses mirror):
  #   1-4   servo 1: V+, GND, CAN_H, CAN_L        5-8   servo 2: V+, GND, CAN_H, CAN_L
  #   9-11  ESC 1 (forward boom): T, S, GND       12-14 ESC 2 (aft boom): T, S, GND
  #   15-17 LED 1: 5 V, signal, GND               18-20 LED 2: 5 V, signal, GND
  #   21-23 wingtip LED: 5 V, signal, GND         24-25 spare
  # The CAN pair of each servo sits on adjacent pins (twist the pair in the cable).
  # Motor numbers follow the ArduPilot QuadPlane Quad X default: 1 front right, 2 rear left,
  # 3 front left, 4 rear right. So the left wing carries VTOL motor 3 (ESC 1, forward boom) and
  # VTOL motor 2 (ESC 2, aft boom); the right wing carries VTOL motor 1 (ESC 1) and 4 (ESC 2).
  # Servos and LEDs: servo 1 and 2, LEDs L1, L2 (StrobeIT-Pro) and LT (wingtip) per wing.
  #
  # DB-25 pair per wing: socket (female) on the fuselage side, plug (male) on the wing side, so the
  # live pins are not exposed on the fuselage side. This gender choice is an assumption.
  # TODO: shell material and part numbers, contact type (crimp or solder), the contact wire range (it
  # must take both the 22 AWG power wires and the 26 AWG signal wires) and the mating hood.
  # TODO: the pin order is not fixed, so all pin references below use the pin labels. Change the
  # label list in the four connectors together.
  SPLIT_L_FUS:
    type: D-sub DB-25 socket
    subtype: female
    pincount: 25
    pinlabels: [SRV1_VPOS, SRV1_GND, SRV1_CANH, SRV1_CANL, SRV2_VPOS, SRV2_GND, SRV2_CANH, SRV2_CANL, ESC1_T, ESC1_S, ESC1_SGND, ESC2_T, ESC2_S, ESC2_SGND, LED1_5V, LED1_SIG, LED1_GND, LED2_5V, LED2_SIG, LED2_GND, LEDT_5V, LEDT_SIG, LEDT_GND, SPARE24, SPARE25]
    hide_disconnected_pins: true
    notes: "Left wing split, fuselage side. Provisional pin map, see above."

  SPLIT_L_WING:
    type: D-sub DB-25 plug
    subtype: male
    pincount: 25
    pinlabels: [SRV1_VPOS, SRV1_GND, SRV1_CANH, SRV1_CANL, SRV2_VPOS, SRV2_GND, SRV2_CANH, SRV2_CANL, ESC1_T, ESC1_S, ESC1_SGND, ESC2_T, ESC2_S, ESC2_SGND, LED1_5V, LED1_SIG, LED1_GND, LED2_5V, LED2_SIG, LED2_GND, LEDT_5V, LEDT_SIG, LEDT_GND, SPARE24, SPARE25]
    hide_disconnected_pins: true
    notes: "Left wing split, wing side. Provisional pin map, see above."

  SPLIT_R_FUS:
    type: D-sub DB-25 socket
    subtype: female
    pincount: 25
    pinlabels: [SRV1_VPOS, SRV1_GND, SRV1_CANH, SRV1_CANL, SRV2_VPOS, SRV2_GND, SRV2_CANH, SRV2_CANL, ESC1_T, ESC1_S, ESC1_SGND, ESC2_T, ESC2_S, ESC2_SGND, LED1_5V, LED1_SIG, LED1_GND, LED2_5V, LED2_SIG, LED2_GND, LEDT_5V, LEDT_SIG, LEDT_GND, SPARE24, SPARE25]
    hide_disconnected_pins: true
    notes: "Right wing split, fuselage side. Provisional pin map, see above."

  SPLIT_R_WING:
    type: D-sub DB-25 plug
    subtype: male
    pincount: 25
    pinlabels: [SRV1_VPOS, SRV1_GND, SRV1_CANH, SRV1_CANL, SRV2_VPOS, SRV2_GND, SRV2_CANH, SRV2_CANL, ESC1_T, ESC1_S, ESC1_SGND, ESC2_T, ESC2_S, ESC2_SGND, LED1_5V, LED1_SIG, LED1_GND, LED2_5V, LED2_SIG, LED2_GND, LEDT_5V, LEDT_SIG, LEDT_GND, SPARE24, SPARE25]
    hide_disconnected_pins: true
    notes: "Right wing split, wing side. Provisional pin map, see above."

  # Zeus Z1500-12V servo, DroneCAN version, one connector per servo. The servo has a 200 mm lead
  # (0.14 mm2 / AWG 26, UL1061) ending in an M5 waterproof 4-pin female connector (datasheet page
  # 10, "M5 Wire"). DroneCAN pin definition: 1 power +, 2 power GND, 3 CAN High, 4 CAN Low.
  # Seen from the mating face the contacts are 3 top left, 4 top right, 2 bottom left, 1 bottom
  # right, with the key at the bottom. Rated 12 V (7 to 15 V); rated current 0.7 A, stall 1.3 A,
  # peak 2.2 A each. The lead belongs to the servo, so nothing goes in the BOM.
  # TODO: the mating M5 male plug (cable end) for the wing harness, and its part number (the
  # cables below end directly on these pins for now). The termination decisions are open (see docs).
  SRV_L1:
    type: M5 waterproof 4-pin female (servo lead)
    subtype: female
    manufacturer: Zeus
    notes: "Z1500-12V DroneCAN servo, left wing servo 1. 12 V, 0.7 A rated, 2.2 A peak."
    pinlabels: [V_POS, GND, CAN_H, CAN_L]
    ignore_in_bom: true

  SRV_L2:
    type: M5 waterproof 4-pin female (servo lead)
    subtype: female
    manufacturer: Zeus
    notes: "Z1500-12V DroneCAN servo, left wing servo 2. 12 V, 0.7 A rated, 2.2 A peak."
    pinlabels: [V_POS, GND, CAN_H, CAN_L]
    ignore_in_bom: true

  SRV_R1:
    type: M5 waterproof 4-pin female (servo lead)
    subtype: female
    manufacturer: Zeus
    notes: "Z1500-12V DroneCAN servo, right wing servo 1. 12 V, 0.7 A rated, 2.2 A peak."
    pinlabels: [V_POS, GND, CAN_H, CAN_L]
    ignore_in_bom: true

  SRV_R2:
    type: M5 waterproof 4-pin female (servo lead)
    subtype: female
    manufacturer: Zeus
    notes: "Z1500-12V DroneCAN servo, right wing servo 2. 12 V, 0.7 A rated, 2.2 A peak."
    pinlabels: [V_POS, GND, CAN_H, CAN_L]
    ignore_in_bom: true

  # Teravolt StrobeIT-Pro (two per wing) and StrobeIT (wingtip, one per wing). Both have a
  # standard 3-pin servo-style interface on three solder pads: 5 V input (1 A max), PWM signal,
  # ground. Use a supply that can give 800 mA peak per LED (full-bright strobe).
  # WARNING: the pad order of the two models is mirrored, so a straight cable from the same
  # harness plug would reverse the supply. Pin IDs below are the pad positions left to right as
  # drawn in the vendor pictures: StrobeIT-Pro is +, S, -; StrobeIT is -, S, +.
  # TODO: lead or header type to solder on (not decided).
  LED_L1:
    type: Solder pads
    manufacturer: Teravolt
    notes: "StrobeIT-Pro, left wing LED 1. Pads left to right: 5V, SIGNAL (PWM), GND."
    pinlabels: [5V, SIGNAL, GND]
    ignore_in_bom: true

  LED_L2:
    type: Solder pads
    manufacturer: Teravolt
    notes: "StrobeIT-Pro, left wing LED 2. Pads left to right: 5V, SIGNAL (PWM), GND."
    pinlabels: [5V, SIGNAL, GND]
    ignore_in_bom: true

  LED_LT:
    type: Solder pads
    manufacturer: Teravolt
    notes: "StrobeIT, left wingtip LED. Pads left to right: GND, SIGNAL (PWM), 5V."
    pinlabels: [GND, SIGNAL, 5V]
    ignore_in_bom: true

  LED_R1:
    type: Solder pads
    manufacturer: Teravolt
    notes: "StrobeIT-Pro, right wing LED 1. Pads left to right: 5V, SIGNAL (PWM), GND."
    pinlabels: [5V, SIGNAL, GND]
    ignore_in_bom: true

  LED_R2:
    type: Solder pads
    manufacturer: Teravolt
    notes: "StrobeIT-Pro, right wing LED 2. Pads left to right: 5V, SIGNAL (PWM), GND."
    pinlabels: [5V, SIGNAL, GND]
    ignore_in_bom: true

  LED_RT:
    type: Solder pads
    manufacturer: Teravolt
    notes: "StrobeIT, right wingtip LED. Pads left to right: GND, SIGNAL (PWM), 5V."
    pinlabels: [GND, SIGNAL, 5V]
    ignore_in_bom: true

  # CAN splitter: SwiftWing 6-port passive splitter, JST-GH 4-pin ports. All ports are bussed in
  # parallel inside the splitter (pin 1 = +5 V, 2 = CAN_H, 3 = CAN_L, 4 = GND on every port); it has
  # no termination and no isolation. Each port is modelled as its own connector (harness side
  # housing). Port 1 goes to the Cube CAN port (not wired here, flight_control_system.yaml comes
  # later); ports 2 to 5 take one servo each (no sharing); port 6 is spare. Which physical port is
  # which does not matter, they are all the same net.
  # WARNING: the splitter pin 1 is 5 V and bussed. The servos have 12 V on their pin 1, so the servo
  # branches use only CAN_H and CAN_L: pin 1 stays empty on ports 2 to 5, and pin 4 (GND) too, since
  # the servo ground returns on the power wires and a second ground path would only add a loop.
  # TODO: 120 ohm termination at the two ends of the bus is not modelled yet (the Cube end and the
  # last servo, or the Cube's own). Do the servos have a built-in 120 ohm? The sheets do not say.
  # Measure CAN_H to CAN_L on an unpowered servo. With no sharing the bus is a star, so the stubs
  # (wing half-span plus fuselage run) are far over the 0.3 m rule of thumb; lower the bitrate if
  # the servos allow it.
  # TODO: GH housing part number and contact type (GHR-04V-S with SSHL-002T-P0.2 for 26 AWG), and
  # confirm that the splitter ports are SM04B-GHS-TB headers.
  CAN_SPL_P1:
    type: JST GH 4-pin
    subtype: female
    manufacturer: JST
    mpn: GHR-04V-S
    notes: "CAN splitter port 1 (passive, bussed): Cube CAN port"
    pinlabels: [VCC_5V, CAN_H, CAN_L, GND]

  CAN_SPL_P2:
    type: JST GH 4-pin
    subtype: female
    manufacturer: JST
    mpn: GHR-04V-S
    notes: "CAN splitter port 2 (passive, bussed): left wing servo 1"
    pinlabels: [VCC_5V, CAN_H, CAN_L, GND]

  CAN_SPL_P3:
    type: JST GH 4-pin
    subtype: female
    manufacturer: JST
    mpn: GHR-04V-S
    notes: "CAN splitter port 3 (passive, bussed): left wing servo 2"
    pinlabels: [VCC_5V, CAN_H, CAN_L, GND]

  CAN_SPL_P4:
    type: JST GH 4-pin
    subtype: female
    manufacturer: JST
    mpn: GHR-04V-S
    notes: "CAN splitter port 4 (passive, bussed): right wing servo 1"
    pinlabels: [VCC_5V, CAN_H, CAN_L, GND]

  CAN_SPL_P5:
    type: JST GH 4-pin
    subtype: female
    manufacturer: JST
    mpn: GHR-04V-S
    notes: "CAN splitter port 5 (passive, bussed): right wing servo 2"
    pinlabels: [VCC_5V, CAN_H, CAN_L, GND]


cables:

  # XT90 male at the wing split -> ESC battery input, one cable per VTOL motor.
  # 10 AWG (recommendation). Motor current is about 16 A at 6 kg thrust and about 75-80 A at full
  # throttle (Vector Technics 8020 PRO 120KV test table, 12S, 30-32 inch props); battery-side
  # current is about the same. 10 AWG silicone wire handles that over a short run and fits the XT90
  # solder cup. APD says to keep the ESC input wires short (long wires cause voltage spikes
  # when the motor brakes); see the capacitor note on the ESC connectors.
  # TODO: confirm with real lengths; go to 8 AWG if the run is long or hot.
  W_ACT_01:
    wirecount: 2
    gauge: 10 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (wing split to ESC)
    notes: "VTOL motor 1 (front right) power, wing split to ESC"

  W_ACT_02:
    wirecount: 2
    gauge: 10 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (wing split to ESC)
    notes: "VTOL motor 2 (rear left) power, wing split to ESC"

  W_ACT_03:
    wirecount: 2
    gauge: 10 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (wing split to ESC)
    notes: "VTOL motor 3 (front left) power, wing split to ESC"

  W_ACT_04:
    wirecount: 2
    gauge: 10 AWG
    colors: [RD, BK]
    length: 0   # TODO: real length after layout analysis (wing split to ESC)
    notes: "VTOL motor 4 (rear right) power, wing split to ESC"

  # ESC motor phase pads -> motor. These are the motor's own leads, so they stay out of the BOM.
  # Gauge and colors are not in the listing; leave the gauge open until the motor is checked.
  # The phase current is roughly the same as the battery current, so if the leads are ever
  # extended, use the same gauge as the cables above (10 AWG). Colors below only tell the ends
  # apart. Phase order does not matter electrically (it sets the spin direction).
  # TODO: real colors, gauge and length from the motor.
  W_ACT_05:
    wirecount: 3
    colors: [YE, GN, BU]
    length: 0   # TODO: real length (motor leads, as short as possible)
    ignore_in_bom: true
