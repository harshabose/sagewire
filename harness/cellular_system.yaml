# Cellular system harness (work in progress)
# Scope so far: Jetson power input (XT30, nothing connected, source not decided) and the
# SIYI A8-MINI camera: Ethernet link (camera Video & Protocol port -> our cable -> RJ45 plug ->
# Jetson Ethernet port) and the power port (4 wires -> XT30 male, mated to an XT30 female that is
# left unconnected, because the BEC architecture is not decided).
# Only the A8-MINI Ethernet and Power ports are used; the Gimbal Control (S.BUS) port is not wired.
# Also: two Waveshare 5G dongles to the Jetson over USB 2.0 (D+, D-, GND; VBUS not wired yet).
# Also: the Cube TELEM2 UART link to the Jetson, through a TTL-to-USB converter that plugs into the
# Jetson USB 2.0 jack.
#
# Cable lengths are 0 for now (placeholder). Real lengths come after the layout analysis.

metadata:
  title: Cellular system
  description: Jetson power input, SIYI camera Ethernet link and two Waveshare 5G dongles on USB 2.0, Cube TELEM2 UART link to the Jetson through a TTL-to-USB converter

connectors:

  # Jetson power input, XT30 as chosen. Nothing is wired to it yet: who powers the Jetson
  # (BEC, PDB pad or another rail) is still open.
  # TODO: XT30 variant and gender (plug or receptacle) on the Jetson side.
  # TODO: supply voltage range and peak current for the actual Jetson module and carrier board.
  JET_PWR:
    type: XT30 connector
    notes: "Jetson power input. Source not decided, left unconnected."
    pinlabels: [VIN, GND]

  # ---- SIYI A8-MINI camera (tag A8M). -----------------------------------------------------------
  # The camera has three ports (SIYI diagram): Video & Protocol (9 pins), Gimbal Control (S.BUS,
  # not used here) and Power (4 pins). Only the Video & Protocol port (Ethernet pairs only) and
  # the Power port are wired.
  #
  # Video & Protocol port, pins in the order of the SIYI diagram: DP, DM, RX-, RX+, TX-, TX+, GND,
  # IO, NC. TX and RX are named from the camera side. Only the four Ethernet pins are wired
  # (two twisted pairs, TX+/TX- and RX+/RX-); DP, DM (USB), GND, IO and NC stay empty.
  # The camera cable photo shows the wire order black, red, white, yellow on pins 3 to 6, which is
  # RX-, RX+, TX-, TX+ in the diagram order.
  # The A8-MINI user manual (v1.10) gives no connector series or part number in its text (the port
  # diagram is a picture), and the housing photo shows two latching headers (9-pin and 4-pin) with
  # no pin 1 marking and no readable part number.
  # TODO: housing series (measure the pitch; the A2-MINI used a GH 1.25 mm), plug or socket, part
  # numbers, and which end is pin 1. The pin numbers below follow the diagram left to right.
  A8M_NET:
    type: 9-pin housing   # TODO: series
    notes: "A8-MINI Video and Protocol port, Ethernet pins only (10/100). Default camera IP 192.168.144.25."
    pinlabels: [DP, DM, RX-, RX+, TX-, TX+, GND, IO, NC]
    hide_disconnected_pins: true

  # Power port, pins in the order of the SIYI diagram: GND, GND, 3S-6S, 3S-6S. Both pins of each
  # pair are wired. Manual spec (v1.10): working voltage 11 to 25.2 V (3S to 6S), average 5 W,
  # peak 12 W. So it is NOT 5 V and not the 12S pack either: it must come from a BEC (not decided
  # yet, see the XT30 pair below). The manual warns that lots before June 2023 may not accept 6S
  # (25.2 V) and that the camera low-voltage warning is below 10 V.
  # TODO: housing series and part number, and which end is pin 1.
  A8M_PWR:
    type: 4-pin housing   # TODO: series
    notes: "A8-MINI power port: 2 x power (3S-6S) and 2 x GND. All four pins wired."
    pinlabels: [GND_1, GND_2, VIN_1, VIN_2]

  # XT30 pair on the camera power lead. The male is on the camera cable; the female is the BEC
  # side and is left with nothing wired because the BEC architecture is not decided. Pin IDs are
  # synthetic (the XT30 has no pin numbers); the housing is keyed, so polarity cannot be reversed.
  # TODO: variant (plain XT30, XT30U, XT30PW) and part numbers; the XT30 contact takes the two
  # paralleled 26 AWG wires per polarity (check the solder cup size).
  A8M_XT30_M:
    type: XT30 male
    subtype: male
    manufacturer: Amass
    notes: "A8-MINI power lead, XT30 male. Mates with A8M_XT30_F."
    pinlabels: [POS, NEG]

  A8M_XT30_F:
    type: XT30 female
    subtype: female
    manufacturer: Amass
    notes: "A8-MINI power, XT30 female (BEC side). Nothing wired to it yet: BEC architecture not decided."
    pinlabels: [POS, NEG]

  # ---- Camera cable RJ45 plug, and the Jetson Ethernet port it plugs into ---------------------
  # The camera Ethernet pins are converted to an RJ45 by our own cable (W_CEL_01). That RJ45 plug
  # (A8M_RJ45) then plugs into the Ethernet port on the Jetson board (JET_ETH). The camera
  # connects straight to the Jetson, no switch. The Jetson runs its own DHCP server.
  # Pin numbers and names on both are the standard RJ45 (T568) ones as seen by the Jetson, an
  # ordinary network port: pins 1/2 = Jetson TX+/TX-, pins 3/6 = Jetson RX+/RX-.
  # So the RJ45 labels are from the Jetson side and the camera pin names are from the camera side:
  # the pairs cross over. Camera RX+ (red in the cable photo) lands on RJ45 pin 1, RX- (black)
  # on pin 2, TX+ (yellow) on pin 3 and TX- (white) on pin 6; pins 4, 5, 7, 8 are empty.
  # Pins 4, 5, 7, 8 are only used for gigabit and are not needed for the 10/100 camera.
  A8M_RJ45:
    type: RJ45 plug (8P8C)
    subtype: male
    notes: "Plug on the A8-MINI cable, into the Jetson Ethernet port. Pins 4, 5, 7, 8 unused (camera is 10/100)."
    pinlabels: [TX+, TX-, RX+, NC, NC, RX-, NC, NC]
    hide_disconnected_pins: true

  # TODO: which Jetson module and carrier board, and where the port sits.
  JET_ETH:
    type: RJ45 jack (8P8C)
    subtype: female
    notes: "Jetson board Ethernet port. Direct link to the camera. Pins 4, 5, 7, 8 not used by the camera."
    pinlabels: [TX+, TX-, RX+, NC, NC, RX-, NC, NC]

  # ---- Waveshare 5G dongles (tag WAV, two of them) -> Jetson, USB 2.0 only -------------------
  # Dongle: Waveshare 5G dongle board with an onboard USB 3.1 Type-A plug (from the photo).
  # Jetson: Waveshare Orin Nano/NX base board, 4 Type-A jacks (3 USB 3.2, 1 USB 2.0).
  # Both dongles are wired USB 2.0 only (D+, D-, GND). The SuperSpeed pins stay unwired, so the
  # link runs at 480 Mbit/s. The dongle's USB 3 plug still fits a USB 2.0 jack.
  # Each dongle has a female jack on our extension (dongle side) and a male plug (Jetson side).
  # VBUS (5 V) is NOT wired yet: the dongle is powered through it and needs about 2 A, so where
  # that power comes from is still to be decided (see the VBUS pins, left open on purpose).
  # USB Type-A pin order: 1 VBUS, 2 D-, 3 D+, 4 GND, 5 SSRX-, 6 SSRX+, 7 GND_DRAIN, 8 SSTX-, 9 SSTX+.
  # TODO: part numbers for the plug and jack, and whether the cable is shielded.
  WAV1_USB:
    type: USB 3.x Type-A plug
    subtype: male
    notes: "Plug on Waveshare dongle 1. Only pins 2, 3, 4 are wired (USB 2.0). The dongle is powered from pin 1 (VBUS)."
    pinlabels: [VBUS, D-, D+, GND, SSRX-, SSRX+, GND_DRAIN, SSTX-, SSTX+]

  WAV1_EXT_F:
    type: USB 2.0 Type-A jack   # TODO: part number
    subtype: female
    notes: "Jack on our extension, dongle 1 plugs into it. A USB 3 plug fits a USB 2.0 jack."
    pinlabels: [VBUS, D-, D+, GND]

  WAV1_EXT_M:
    type: USB 2.0 Type-A plug   # TODO: part number
    subtype: male
    notes: "Plug on our extension, goes into the Jetson USB jack."
    pinlabels: [VBUS, D-, D+, GND]

  JET_USB1:
    type: USB Type-A jack (Jetson base board)
    subtype: female
    notes: "Jetson base board USB-A jack for dongle 1. TODO: which jack (3 are USB 3.2, 1 is USB 2.0)."
    pinlabels: [VBUS, D-, D+, GND, SSRX-, SSRX+, GND_DRAIN, SSTX-, SSTX+]

  WAV2_USB:
    type: USB 3.x Type-A plug
    subtype: male
    notes: "Plug on Waveshare dongle 2. Only pins 2, 3, 4 are wired (USB 2.0). The dongle is powered from pin 1 (VBUS)."
    pinlabels: [VBUS, D-, D+, GND, SSRX-, SSRX+, GND_DRAIN, SSTX-, SSTX+]

  WAV2_EXT_F:
    type: USB 2.0 Type-A jack   # TODO: part number
    subtype: female
    notes: "Jack on our extension, dongle 2 plugs into it. A USB 3 plug fits a USB 2.0 jack."
    pinlabels: [VBUS, D-, D+, GND]

  WAV2_EXT_M:
    type: USB 2.0 Type-A plug   # TODO: part number
    subtype: male
    notes: "Plug on our extension, goes into the Jetson USB jack."
    pinlabels: [VBUS, D-, D+, GND]

  JET_USB2:
    type: USB Type-A jack (Jetson base board)
    subtype: female
    notes: "Jetson base board USB-A jack for dongle 2. TODO: which jack (3 are USB 3.2, 1 is USB 2.0)."
    pinlabels: [VBUS, D-, D+, GND, SSRX-, SSRX+, GND_DRAIN, SSTX-, SSTX+]

  # ---- Cube TELEM2 -> TTL-to-USB converter -> Jetson USB 2.0 jack (MAVLink telemetry link) ------
  # The Cube telemetry port TELEM2 is wired to a TTL-to-USB converter board, which plugs straight
  # into the Jetson's USB 2.0 jack (the one USB 2.0 Type-A jack on the base board; the other three
  # are USB 3.2, and the two 5G dongles use those, see the TODOs on JET_USB1 and JET_USB2).
  # The radio's own UART is on TELEM1 (rf_system.yaml).
  # TODO: part numbers for everything in this link (Cube plug, converter, jack), not chosen yet.
  #
  # Cube Orange+ TELEM2, 6-pin: 1 VCC 5 V, 2 TX (out), 3 RX (in), 4 CTS, 5 RTS, 6 GND, all signals
  # 3.3 V (same pin order as TELEM1, standard Cube pinout). Only TX, RX and GND are used. The 5 V
  # pin stays empty (the converter is powered from the Jetson USB), and CTS and RTS stay empty
  # (no flow control).
  # TODO: plug series (the Cube end is a JST GH).
  FC_TELEM2:
    type: 6-pin TELEM plug   # TODO: series
    notes: "Cube Orange+ TELEM2 port (UART). Cube TX (pin 2) goes to the converter RXD, Cube RX (pin 3) to the converter TXD. 3.3 V logic."
    pinlabels: [VCC, TX, RX, CTS, RTS, GND]
    hide_disconnected_pins: true

  # TTL-to-USB converter, UART side. Pin names are from the converter's side: TXD is its output
  # (to the Cube RX), RXD its input (from the Cube TX). Any VCC / 3V3 pin on the converter is not
  # connected (the Cube 5 V pin is empty).
  # TODO: converter part number, its UART connector (header or housing) and pin order, and its
  # logic level: it must be 3.3 V (the Cube TELEM2 is 3.3 V; some converters are 5 V or have a
  # jumper).
  U2T_UART:
    type: UART header (TTL side)   # TODO: series
    notes: "TTL-to-USB converter, UART side. Converter TXD goes to the Cube RX, converter RXD to the Cube TX. Must be 3.3 V logic."
    pinlabels: [TXD, RXD, GND]

  # TTL-to-USB converter, USB side: assumed to have an onboard USB Type-A plug (like the dongles),
  # so it plugs straight into the Jetson jack with no cable. USB 2.0 only (VBUS, D-, D+, GND),
  # which is all the Jetson jack has. VBUS powers the converter.
  # TODO: confirm the converter has an onboard Type-A plug (if it is micro-USB or USB-C, add a
  # cable and the matching plug here).
  U2T_USB:
    type: USB 2.0 Type-A plug (on converter)   # TODO: part number
    subtype: male
    notes: "TTL-to-USB converter USB plug, goes straight into the Jetson USB 2.0 jack. VBUS powers the converter."
    pinlabels: [VBUS, D-, D+, GND]

  JET_USB3:
    type: USB 2.0 Type-A jack (Jetson base board)
    subtype: female
    notes: "Jetson base board USB 2.0 jack, for the TTL-to-USB converter (Cube TELEM2 link). TODO: confirm which physical jack is the USB 2.0 one."
    pinlabels: [VBUS, D-, D+, GND]

cables:

  # Two twisted pairs, wire colours follow T568B so the pairs match the RJ45 pin pairs:
  #   white-orange + orange = RJ45 pins 1, 2  (Jetson TX pair, goes to camera RX pins)
  #   white-green + green   = RJ45 pins 3, 6  (Jetson RX pair, comes from camera TX pins)
  # Keep each pair twisted all the way to the pins.
  # TODO: cable type and gauge (shielded or not) are not chosen. 26 AWG is a placeholder.
  W_CEL_01:
    wirecount: 4
    gauge: 26 AWG
    colors: [WHOG, OG, WHGN, GN]
    length: 0   # TODO: set after layout
    notes: "A8-MINI Ethernet pins to RJ45 plug. Two twisted pairs, crossover wiring (see comments)."

  # A8-MINI power port -> XT30 male. Two wires per polarity, one per power-port pin: the red pair
  # to the two power pins, the black pair to the two GND pins, each pair joined at the XT30 pin.
  # The load is well under 1 A in total. 26 AWG is a placeholder (the port housing is not
  # chosen yet, a GH contact takes 26 to 30 AWG).
  # TODO: gauge once the housing series is known, and length after layout.
  W_CEL_04:
    wirecount: 4
    gauge: 26 AWG
    colors: [RD, RD, BK, BK]
    length: 0   # TODO: set after layout
    notes: "A8-MINI power port to XT30 male. Wires 1, 2 = power (red), 3, 4 = GND (black)."

  # Dongle 1 to Jetson. Standard USB 2.0 colours: white = D-, green = D+, black = GND.
  # Keep D- and D+ twisted together. VBUS (red) is not wired yet.
  # TODO: cable type, gauge (28 AWG is a placeholder for the data pair) and shield.
  W_CEL_02:
    wirecount: 3
    gauge: 28 AWG
    colors: [WH, GN, BK]
    length: 0   # TODO: set after layout
    notes: "USB 2.0 data and ground for dongle 1. VBUS not wired yet."

  # Dongle 2 to Jetson. Standard USB 2.0 colours: white = D-, green = D+, black = GND.
  # Keep D- and D+ twisted together. VBUS (red) is not wired yet.
  # TODO: cable type, gauge (28 AWG is a placeholder for the data pair) and shield.
  W_CEL_03:
    wirecount: 3
    gauge: 28 AWG
    colors: [WH, GN, BK]
    length: 0   # TODO: set after layout
    notes: "USB 2.0 data and ground for dongle 2. VBUS not wired yet."

  # Cube TELEM2 -> TTL-to-USB converter UART. 3.3 V UART, so any thin wire does. 28 AWG sits inside
  # the GH contact range (26 to 30 AWG) on the Cube end; the converter end is not chosen yet.
  # Colours follow W_RF_01: yellow = Cube TX (to converter RXD), green = Cube RX (from converter
  # TXD), black = ground.
  # TODO: gauge once the converter connector is known, shielded or twisted pair if the run turns
  # out long or noisy, the baud rate on the Cube side, and length after layout.
  W_CEL_05:
    wirecount: 3
    gauge: 28 AWG
    colors: [YE, GN, BK]
    length: 0   # TODO: real length after layout analysis
    notes: "Cube TELEM2 to TTL-to-USB converter UART"

connections:

  # Camera TX goes to the Jetson RX and camera RX goes to the Jetson TX (crossover).
  # Camera pin names are assumed to be from the camera side (SIYI diagram, see A8M_NET).
  # If SIYI named them from the other side, the Jetson port should still link up (automatic
  # crossover correction in its Ethernet chip); TODO: confirm for the actual Jetson board.
  # What must never change: each pair stays together (camera TX+ with TX-, camera RX+ with RX-).
  # Step 1: camera Ethernet pins to the RJ45 plug, through our cable.
  -
    - A8M_NET: [RX+, RX-, TX+, TX-]
    - W_CEL_01: [1, 2, 3, 4]
    - A8M_RJ45: [1, 2, 3, 6]    # TX+, TX-, RX+, RX- (Jetson side names)

  # Step 2: the RJ45 plug mates with the Jetson Ethernet port, pin for pin (straight through).
  -
    - A8M_RJ45: [1, 2, 3, 6]
    - -->
    - JET_ETH: [1, 2, 3, 6]

  # Camera power: the two power pins and the two GND pins go to the XT30 male (two wires land on
  # each XT30 pin).
  -
    - A8M_PWR: [VIN_1, VIN_2, GND_1, GND_2]
    - W_CEL_04: [1, 2, 3, 4]
    - A8M_XT30_M: [POS, POS, NEG, NEG]

  # The XT30 female mates into the XT30 male, pin for pin (1 = POS, 2 = NEG; a mate needs pin
  # numbers, not labels). Nothing else is connected to the female: the BEC architecture is not
  # decided yet.
  -
    - A8M_XT30_F: [1, 2]
    - -->
    - A8M_XT30_M: [1, 2]

  # Dongle 1: dongle plug mates with our jack, the cable runs to our plug, which mates with the Jetson jack.
  -
    - WAV1_EXT_F: [2, 3, 4]     # D-, D+, GND
    - W_CEL_02: [1, 2, 3]
    - WAV1_EXT_M: [2, 3, 4]
  -
    - WAV1_USB: [1, 2, 3, 4]
    - -->
    - WAV1_EXT_F: [1, 2, 3, 4]
  -
    - WAV1_EXT_M: [1, 2, 3, 4]
    - -->
    - JET_USB1: [1, 2, 3, 4]

  # Dongle 2: dongle plug mates with our jack, the cable runs to our plug, which mates with the Jetson jack.
  -
    - WAV2_EXT_F: [2, 3, 4]     # D-, D+, GND
    - W_CEL_03: [1, 2, 3]
    - WAV2_EXT_M: [2, 3, 4]
  -
    - WAV2_USB: [1, 2, 3, 4]
    - -->
    - WAV2_EXT_F: [1, 2, 3, 4]
  -
    - WAV2_EXT_M: [1, 2, 3, 4]
    - -->
    - JET_USB2: [1, 2, 3, 4]

  # Cube TELEM2 -> TTL-to-USB converter. Cube TX goes to the converter RXD and Cube RX to the
  # converter TXD (crossover, as for any UART link).
  -
    - FC_TELEM2: [TX, RX, GND]
    - W_CEL_05: [1, 2, 3]
    - U2T_UART: [RXD, TXD, GND]

  # The converter plugs straight into the Jetson USB 2.0 jack, pin for pin (no cable).
  -
    - U2T_USB: [1, 2, 3, 4]
    - -->
    - JET_USB3: [1, 2, 3, 4]
